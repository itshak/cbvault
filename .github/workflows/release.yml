name: Release

on:
  push:
    tags:
      - "v*"
    branches:
      - "main"
    # A version bump merged to main releases without a manually pushed tag.
    # GitHub ignores path filters on tag pushes; manual tags remain supported.
    paths:
      - "Cargo.toml"

permissions:
  contents: write

jobs:
  publish:
    name: Build, Test & Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify Tag matches Cargo.toml version
        id: version
        run: |
          # The version lives in [workspace.package], and the root manifest is a
          # *virtual* manifest, so `cargo read-manifest` cannot be used here: it
          # errors with "manifest path is a virtual manifest" (and is deprecated
          # in favour of `cargo metadata`). Read the version out of metadata
          # instead, and require every member to agree so a partial version bump
          # cannot ship.
          CARGO_VERSIONS=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '[.packages[].version] | unique | join(",")')
          case "$GITHUB_REF" in
            refs/tags/v*)
              TAG_VERSION="${GITHUB_REF#refs/tags/v}"
              PUBLISH=true ;;
            refs/heads/main)
              TAG_VERSION="$CARGO_VERSIONS"
              if git ls-remote --tags origin "refs/tags/v${TAG_VERSION}" | grep -q .; then
                echo "::notice::v${TAG_VERSION} already tagged; no new version to release."
                PUBLISH=false
              else
                PUBLISH=true
              fi ;;
            *) echo "::error::Unexpected release ref $GITHUB_REF"; exit 1 ;;
          esac
          echo "Release version: $TAG_VERSION"
          echo "Cargo version: $CARGO_VERSIONS"
          if [ "$TAG_VERSION" != "$CARGO_VERSIONS" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match Cargo.toml version ($CARGO_VERSIONS)"
            exit 1
          fi
          echo "VERSION=$TAG_VERSION" >> "$GITHUB_OUTPUT"
          echo "PUBLISH=$PUBLISH" >> "$GITHUB_OUTPUT"

      - name: Resolve publish order
        if: steps.version.outputs.PUBLISH == 'true'
        id: order
        run: |
          # cbvault is a workspace, so there is no single `cargo publish`. The
          # publishable crates depend on each other, and a dependent crate can
          # only be published once its dependency is on crates.io, so the order
          # must be topological. Derive it from `cargo metadata` rather than
          # hardcoding it, so adding a crate cannot silently break the release.
          #
          # `publish = false` members (cbvault-fixtures) are excluded: they are
          # never shipped and cargo would refuse them anyway.
          #
          # The `as $p` binding is load-bearing and was a real bug. Written as
          # `map("\(.name)|\(.deps | ...)")`, the `\(.deps | sort | join(","))`
          # interpolation evaluates its expression against **the array itself**
          # rather than against the element, so `sort` is applied to a stream of
          # objects and jq fails with "cannot be sorted, as it is not an array".
          # Binding the element first and interpolating `$p.deps` is
          # unambiguous. It only showed up when the script was actually run
          # against real `cargo metadata` output, which is the only way a shell
          # expression gets tested at all.
          meta=$(cargo metadata --no-deps --format-version 1)
          edges=$(printf '%s' "$meta" | jq -r '
            [ .packages[]
              | select(.publish != [])
              | { name: .name,
                  deps: [ .dependencies[]
                          | select(.path != null and (.kind == null))
                          | .name ] } ]
            | map(. as $p | "\($p.name)|\($p.deps | sort | join(","))")
            | .[]')
          if [ -z "$edges" ]; then
            echo "::error::no publishable crate found in the workspace."
            exit 1
          fi
          publishable=$(printf '%s\n' $edges | cut -d'|' -f1 | sort)
          order=""
          remaining="$edges"
          while [ -n "$remaining" ]; do
            progress=0
            for entry in $remaining; do
              crate="${entry%%|*}"
              deps="${entry#*|}"
              ready=1
              # Only *normal* intra-workspace deps gate the order: a dev-dep does
              # not have to exist on crates.io for the dependent to publish.
              if [ -n "$deps" ]; then
                for dep in ${deps//,/ }; do
                  if printf '%s\n' $publishable | grep -qx "$dep" \
                     && ! printf '%s\n' $order | grep -qx "$dep"; then
                    ready=0
                    break
                  fi
                done
              fi
              if [ "$ready" = 1 ]; then
                order="${order:+$order }$crate"
                remaining=$(printf '%s\n' $remaining | grep -v "^${crate}|" || true)
                progress=1
              fi
            done
            if [ "$progress" = 0 ]; then
              echo "::error::could not resolve a publish order; unresolved: $remaining"
              exit 1
            fi
          done
          echo "Publish order: $order"
          echo "ORDER=$order" >> $GITHUB_OUTPUT
          # The first crate in a topological order is the one with no
          # intra-workspace dependencies, and therefore the only one that can be
          # packaged before anything is published. "Package Check" needs this.
          echo "ORDER_ROOT=${order%% *}" >> $GITHUB_OUTPUT
      - name: Extract changelog for this version
        if: steps.version.outputs.PUBLISH == 'true'
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          if [ -f CHANGELOG.md ]; then
            CHANGELOG=$(awk "/^## \[${VERSION}\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md)
          else
            CHANGELOG="Release v${VERSION}"
          fi
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Verify Tests Pass
        if: steps.version.outputs.PUBLISH == 'true'
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --all-features
          cargo test --workspace --examples --all-features

      - name: Package Check
        if: steps.version.outputs.PUBLISH == 'true'
        run: |
          # Packaging alone cannot be validated here for every crate, and the
          # reason is worth recording because it broke the v0.1.0 release.
          #
          # `cargo package` and `cargo publish --dry-run` both resolve a crate's
          # dependencies **from the registry** before doing anything else. In a
          # workspace whose crates depend on each other, the second crate in a
          # topological order therefore fails with
          #
          #   no matching package named `cbvault-format` found
          #
          # because its sibling is not published yet. That is the registry
          # correctly reporting a missing dependency, not a broken crate, and
          # neither `--no-verify` nor `--allow-dirty` helps because resolution
          # happens first.
          #
          # So the pre-publish check is the one that needs no registry: does the
          # dependency-free root of the order package? That is `cbvault-format`
          # here, and it is a real check rather than a formality - it is the
          # crate most likely to have a packaging problem and its artifact is
          # what every other crate is built against. The dependent crates are
          # verified where resolution is actually possible: inside the publish
          # loop below, by `--dry-run` immediately before each upload, once
          # that crate's dependencies are live in the index.
          echo "::group::Package ${{ steps.order.outputs.ORDER_ROOT }}"
          cargo package -p "${{ steps.order.outputs.ORDER_ROOT }}" --allow-dirty
          echo "::endgroup::"
      - name: Publish to crates.io
        if: steps.version.outputs.PUBLISH == 'true'
        run: |
          if [ -z "${{ secrets.CARGO_REGISTRY_TOKEN }}" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN secret is not set in GitHub repository settings."
            exit 1
          fi
          VERSION="${{ steps.version.outputs.VERSION }}"
          # crates.io requires a User-Agent and answers 403 without one. Without
          # this header every lookup below "fails", which looks exactly like "not
          # published yet" and would turn a re-run into a red build.
          UA="cbvault-release (https://github.com/itshak/cbvault)"

          published() { # crate version -> success when that exact version is live
            curl -sf -A "$UA" "https://crates.io/api/v1/crates/$1/$2" >/dev/null
          }

          wait_for_index() { # the next crate cannot resolve a dep until it lands
            local crate="$1" ver="$2" tries=30
            while [ "$tries" -gt 0 ]; do
              if published "$crate" "$ver"; then
                echo "$crate $ver is visible in the crates.io index"
                return 0
              fi
              tries=$((tries - 1))
              sleep 10
            done
            echo "::error::$crate $ver did not appear in the crates.io index in time"
            return 1
          }

          for crate in ${{ steps.order.outputs.ORDER }}; do
            # crates.io versions are immutable and there is no "unpublish", only
            # "yank", so re-running a tag's workflow (a moved or re-pushed tag)
            # would otherwise fail on a version that is already out. Treat an
            # already-present version as done and say so plainly rather than
            # reporting a failure that needs no action. Skipping per crate rather
            # than exiting the job is what lets a partially-published workspace
            # release finish the crates that are still missing.
            if published "$crate" "$VERSION"; then
              echo "::notice::$crate $VERSION is already on crates.io; skipping it."
              continue
            fi
            echo "::group::Publishing $crate $VERSION"
            # The dry run lives *here* rather than before the loop, because this
            # is the first moment at which this crate's dependencies can resolve.
            # Every earlier attempt to dry-run the whole order up front failed on
            # the second crate; see "Package Check".
            cargo publish -p "$crate" --dry-run
            cargo publish -p "$crate"
            echo "::endgroup::"
            wait_for_index "$crate" "$VERSION"
          done
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Tag the published main-branch revision
        if: steps.version.outputs.PUBLISH == 'true' && github.ref == 'refs/heads/main'
        run: |
          version="${{ steps.version.outputs.VERSION }}"
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
            tag -a "v${version}" -m "cbvault v${version}"
          git push origin "refs/tags/v${version}"

      # GitHub's standard GITHUB_TOKEN may not have repository-administration
      # permission. When available, REPO_ADMIN_TOKEN can update the About field;
      # absence of that permission is nonfatal for crate publication.
      - name: Refresh GitHub repository description
        if: steps.version.outputs.PUBLISH == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}" \
            -f description="MIT Rust reader and CLI for ChessBase .cbh/.2cbh/.cbv/.cbz: annotated PGN, search and parallel conversion; 2CBH tested on 3.41M games." \
            -f homepage="https://crates.io/crates/cbvault"

      - name: Create GitHub Release
        if: steps.version.outputs.PUBLISH == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: v${{ steps.version.outputs.VERSION }}
          body: ${{ steps.changelog.outputs.CHANGELOG }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}