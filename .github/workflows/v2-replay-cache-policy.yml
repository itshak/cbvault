name: 2CBH replay cache policy benchmarks
on:
  push:
    branches: [experiment/v2-replay-cache-policy]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paired:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        tier: [smoke, rich, scale]
    env:
      TIER: ${{ matrix.tier }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 44d67519f0399592ea13a5d6e6723efb2ad0545d
          path: baseline-src
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.97.1'
          components: clippy
      - name: Correctness and build
        run: |
          cargo +1.97.1 test --locked -p cbvault-chess --test twocbh_decode
          cargo +1.97.1 test --locked -p cbvault --lib bridge::tests
          cargo +1.97.1 test --locked -p cbvault --test twocbh_bridge
          CBVAULT_NO_MMAP=1 cargo +1.97.1 test --locked -p cbvault --test twocbh_bridge
          cargo +1.97.1 clippy --locked -p cbvault --lib --example native_workload -- -D warnings
          cp crates/cbvault/examples/native_workload.rs baseline-src/crates/cbvault/examples/
          cargo +1.97.1 build --locked --release -p cbvault --example native_workload --manifest-path baseline-src/Cargo.toml --target-dir "$RUNNER_TEMP/base-target"
          cargo +1.97.1 build --locked --release -p cbvault --example native_workload --target-dir "$RUNNER_TEMP/head-target"
      - name: Fetch and verify public corpus
        run: |
          mkdir -p benchmark-report
          read -r stem sha url < <(python3 -c 'import json,os; m=json.load(open("scripts/bench-corpus/native-manifest.json"))["tiers"][os.environ["TIER"]]; print(m["stem"],m["sha256"],m["url"])')
          curl --fail --location --retry 3 "$url" -o "$RUNNER_TEMP/fixture.tar.zst"
          python3 scripts/bench-corpus/native-fixtures.py "$RUNNER_TEMP/fixture.tar.zst" "$sha" "$stem" "$RUNNER_TEMP/native" > benchmark-report/member-hashes.json
          python3 - <<'PY'
          import json,os
          m=json.load(open("scripts/bench-corpus/native-manifest.json"))["tiers"][os.environ["TIER"]]
          assert json.load(open("benchmark-report/member-hashes.json"))==m["members"]
          PY
      - name: Compare keyed replay and streaming with exact fingerprints
        run: |
          python3 scripts/bench-corpus/native-stream-bench.py --tier "$TIER" --fixtures "$RUNNER_TEMP/native" --base "$RUNNER_TEMP/base-target/release/examples/native_workload" --head "$RUNNER_TEMP/head-target/release/examples/native_workload" --report benchmark-report/cache-policy.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cache-policy-${{ matrix.tier }}
          path: benchmark-report/
