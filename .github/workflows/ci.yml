name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  check-and-test:
    name: Check & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Bash on every platform, including Windows. The toolchain check below uses
    # bash parameter expansion and `sort -V`, and PowerShell would not run it —
    # so without this the Windows job would fail on a shell difference rather
    # than on anything about the code. Git Bash is present on `windows-latest`.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        # `windows-latest` is not optional. `cbvault-format` 0.1.0 shipped with
        # `memmap2::Advice` — a `#[cfg(unix)]` type — called behind a default-on
        # feature without a target gate, so the crate did not compile on Windows
        # at all. Both CI operating systems were Unix, so the tree was green and
        # a published version was unusable on Windows. A
        # Unix-only matrix cannot see a Unix-only API; the platform a consumer
        # builds on has to be a platform this job builds.
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy, rustfmt

      - name: Verify toolchain satisfies rust-version
        run: |
          # rust-toolchain.toml pins the channel, but it cannot stop a runner
          # whose `stable` predates the workspace `rust-version`. Edition 2024
          # and the ported cbformat code need 1.88+; without this check an old
          # runner fails deep inside a build with a confusing parse error
          # instead of one clear line naming the version it needs.
          required=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '[.packages[].rust_version] | map(select(. != null)) | unique | join(",")')
          have=$(rustc --version | awk '{print $2}')
          echo "Required rust-version: $required"
          echo "Runner rustc: $have"
          if [ -z "$required" ]; then
            echo "::notice::no rust-version is declared; skipping the MSRV check."
            exit 0
          fi
          for want in ${required//,/ }; do
            oldest=$(printf '%s\n%s\n' "$want" "$have" | sort -V | head -1)
            if [ "$oldest" != "$want" ]; then
              echo "::error::runner rustc $have is older than the required rust-version $want."
              echo "::error::bump the matrix toolchain, or lower rust-version if it is wrong."
              exit 1
            fi
          done

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Cargo check (all targets)
        run: cargo check --all-targets

      - name: Cargo check (all features)
        run: cargo check --all-targets --all-features

      # -D warnings is the gate: a new lint must be a deliberate decision, not
      # a warning nobody reads in a collapsed log.
      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Cargo test (all features)
        run: cargo test --all-features

      # Cargo's default test selection does not execute #[test] functions in
      # example binaries; the strict local gold oracle has adversarial
      # generated parser and SHA-256 tests that must execute on every OS.
      - name: Cargo test (examples, all features)
        run: cargo test --workspace --examples --all-features

      # The mmap and read-backed SegmentRecord lifetimes differ. Exercise
      # generated v2 bridge, annotation and parallel conversion in both modes;
      # never mount or upload a licensed ChessBase database to CI.
      - name: Synthetic 2CBH tests without mmap
        if: matrix.os == 'ubuntu-latest'
        env:
          CBVAULT_NO_MMAP: "1"
        run: cargo test -p cbvault --all-features --test twocbh_bridge --test twocbh_parallel_sink --test twocbh_annotation_fail_closed


      - name: Cargo fmt
        run: cargo fmt --all --check

      - name: Benchmark compilation check
        run: cargo check --benches --all-features

      # Validate permanent specs and active changes structurally. Strict mode
      # is intentionally not applied to the legacy permanent spec: it already
      # has long-requirement (>500 character) *style warnings* unrelated to
      # this 2CBH archive. The prior CI strictly validated only the active
      # 2CBH delta; after archival that change name no longer exists.
      # Run once on Linux rather than installing Node on all Rust runners.
      - name: Set up Node for OpenSpec
        if: matrix.os == 'ubuntu-latest'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: OpenSpec validation (all specs and changes)
        if: matrix.os == 'ubuntu-latest'
        run: npx --yes @fission-ai/openspec@1.16.0 validate --all --no-interactive

      - name: Archived 2CBH hardening tasks are complete
        if: matrix.os == 'ubuntu-latest'
        run: |
          tasks=openspec/changes/archive/2026-11-10-native-2cbh-release-hardening/tasks.md
          test -f "$tasks"
          if grep -nE '^[[:space:]]*-[[:space:]]+\\[[[:space:]]+\\]' "$tasks"; then
            echo "::error::The archived 2CBH hardening change has unchecked tasks."
            exit 1
          fi
          echo "All 2CBH release-hardening archive tasks are checked."

  standalone-library:
    name: Standalone library naming
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No downstream product names in tracked content or paths
        shell: bash
        run: |
          # The regexp catches joined, hyphenated, underscored and spaced
          # variants; it does not itself spell a brand name in the source tree.
          if git grep -n -i -E 'blind[[:space:]_-]*base'; then
            echo "::error::Found downstream app branding in library content."
            exit 1
          fi
          if git ls-files | grep -n -i -E 'blind[[:space:]_-]*base'; then
            echo "::error::Found downstream app branding in library paths."
            exit 1
          fi
          echo "Standalone library naming verified."

  fuzz:
    name: cargo-fuzz (nightly)
    runs-on: ubuntu-latest
    # The fuzz targets need nightly (`-Zsanitizer`); stable stays the default
    # toolchain everywhere else. Ubuntu only: libfuzzer/ASan is fine there and
    # one platform is enough for a smoke run. 60 s per target matches the
    # change's acceptance runs (9.4M + 1.1M execs, zero crashes).
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/cbvault-format/fuzz

      - name: Build fuzz targets
        working-directory: crates/cbvault-format/fuzz
        run: cargo +nightly fuzz build

      - name: Fuzz cbh_record (60 s)
        working-directory: crates/cbvault-format/fuzz
        run: cargo +nightly fuzz run cbh_record -- -max_total_time=60

      - name: Fuzz cbg_framing (60 s)
        working-directory: crates/cbvault-format/fuzz
        run: cargo +nightly fuzz run cbg_framing -- -max_total_time=60

  one-chess-core:
    name: no chesscore / shakmaty
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail on a second chess implementation
        run: |
          # gigachess is the only chess core in this tree. `chesscore` and
          # `shakmaty` may be named in docs (provenance), never in code or manifests.
          # `vendor/` is the git-ignored ancestor snapshot and never exists in CI.
          bad_uses=$(grep -RnE '^[[:space:]]*(pub[[:space:]]+)?use[[:space:]].*\b(chesscore|shakmaty)\b' --include='*.rs' crates/ || true)
          bad_deps=$(grep -RnE '\b(chesscore|shakmaty)\b' --include='Cargo.toml' --exclude-dir=vendor --exclude-dir=target . || true)
          if [ -n "$bad_uses$bad_deps" ]; then
            echo "found a second chess implementation:"; echo "$bad_uses"; echo "$bad_deps"; exit 1
          fi
          echo "only gigachess is used"
