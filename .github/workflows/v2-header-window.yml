name: Shared 2CBH header windows
on:
  push:
    branches: [experiment/v2-bulk-header-windows]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paired:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        tier: [smoke, standard, scale]
    env:
      TIER: ${{ matrix.tier }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 6bb2eef042c2ddd18578a31347f5e9d38e7c0909
          path: baseline-src
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.97.1'
          components: clippy
      - name: Correctness and build
        run: |
          cargo +1.97.1 test --locked -p cbvault --test twocbh_bridge --test twocbh_parallel_sink
          CBVAULT_NO_MMAP=1 cargo +1.97.1 test --locked -p cbvault --test twocbh_bridge --test twocbh_parallel_sink
          cargo +1.97.1 clippy --locked -p cbvault --lib --example header_window_workload --example native_workload -- -D warnings
          cp crates/cbvault/examples/header_window_workload.rs baseline-src/crates/cbvault/examples/
          cargo +1.97.1 build --locked --release -p cbvault --example header_window_workload --example native_workload --manifest-path baseline-src/Cargo.toml --target-dir "$RUNNER_TEMP/base-target"
          cargo +1.97.1 build --locked --release -p cbvault --example header_window_workload --example native_workload --target-dir "$RUNNER_TEMP/head-target"
      - name: Fetch and verify public corpus
        run: |
          mkdir -p benchmark-report
          read -r stem sha url < <(python3 -c 'import json,os; m=json.load(open("scripts/bench-corpus/native-manifest.json"))["tiers"][os.environ["TIER"]]; print(m["stem"],m["sha256"],m["url"])')
          curl --fail --location --retry 3 "$url" -o "$RUNNER_TEMP/fixture.tar.zst"
          python3 scripts/bench-corpus/native-fixtures.py "$RUNNER_TEMP/fixture.tar.zst" "$sha" "$stem" "$RUNNER_TEMP/native" > benchmark-report/member-hashes.json
          python3 - <<'PY'
          import json,os
          m=json.load(open("scripts/bench-corpus/native-manifest.json"))["tiers"][os.environ["TIER"]]
          assert json.load(open("benchmark-report/member-hashes.json"))==m["members"]
          PY
      - name: Compare named metadata, positions and streams
        run: |
          python3 scripts/bench-corpus/v2-header-window-bench.py "$TIER" "$RUNNER_TEMP/native" "$RUNNER_TEMP/base-target/release/examples" "$RUNNER_TEMP/head-target/release/examples" benchmark-report/header-window.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: header-window-${{ matrix.tier }}
          path: benchmark-report/
