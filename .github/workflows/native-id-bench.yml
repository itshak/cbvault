name: Native ID-only search benchmarks
on:
  push:
    branches: [experiment/header-only-search]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-id-search-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  paired:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        tier: [smoke, rich, extreme, standard, scale]
    env:
      TIER: ${{ matrix.tier }}
    steps:
      - uses: actions/checkout@v4
      - name: Select verified baseline and preflight disk
        id: corpus
        run: |
          python3 - <<'PY'
          import json, os, shutil
          m = json.load(open("scripts/bench-corpus/native-manifest.json"))["tiers"][os.environ["TIER"]]
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              print("baseline=4bdcb5bd6bad314647fc26203f78c7bae7254d77", file=f)
          # Extracted DB, archive, export scratch, and two release builds.
          needed = sum(x["bytes"] for x in m["members"].values()) + (3 * 1024**3)
          if os.environ["TIER"] == "scale":
              needed += 4 * 1024**3
          elif os.environ["TIER"] == "standard":
              needed += 2 * 1024**3
          assert shutil.disk_usage(os.environ["RUNNER_TEMP"]).free >= needed, "insufficient runner disk"
          PY
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.corpus.outputs.baseline }}
          path: baseline-src
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.97.1'
          components: clippy
      - name: Fetch and verify native corpus
        run: |
          set -euo pipefail
          read -r stem sha url < <(python3 -c 'import json,os; m=json.load(open("scripts/bench-corpus/native-manifest.json"))["tiers"][os.environ["TIER"]]; print(m["stem"],m["sha256"],m["url"])')
          curl --fail --location --retry 3 "$url" -o "$RUNNER_TEMP/fixture.tar.zst"
          python3 scripts/bench-corpus/native-fixtures.py "$RUNNER_TEMP/fixture.tar.zst" "$sha" "$stem" "$RUNNER_TEMP/native" > "$RUNNER_TEMP/member-hashes.json"
          python3 - <<'PY'
          import json, os, pathlib
          expected = json.load(open("scripts/bench-corpus/native-manifest.json"))["tiers"][os.environ["TIER"]]["members"]
          actual = json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"member-hashes.json").read_text())
          assert actual == expected, "native companion hashes differ"
          PY
          df -h "$RUNNER_TEMP"
      - name: Build identical ID consumers against old and new API
        run: |
          # Baseline performs a named scan and then extracts IDs; candidate
          # requests just IDs. The caller and fingerprint are otherwise identical.
          sed 's/scan_ids/scan/g' crates/cbvault/examples/native_id_workload.rs > baseline-src/crates/cbvault/examples/native_id_workload.rs
          cargo +1.97.1 build --locked --release -p cbvault --example native_id_workload --manifest-path baseline-src/Cargo.toml --target-dir "$RUNNER_TEMP/base-target"
          cargo +1.97.1 build --locked --release -p cbvault --example native_id_workload --target-dir "$RUNNER_TEMP/head-target"
      - name: ID parity and malformed-range regression
        if: matrix.tier == 'smoke'
        run: |
          cargo +1.97.1 test --locked --release -p cbvault classic_id_only_scan_matches_named_scan --target-dir "$RUNNER_TEMP/head-target"
          cargo +1.97.1 test --locked --release -p cbvault --test twocbh_bridge v2_id_only_scan_matches_named_scan_across_batches --target-dir "$RUNNER_TEMP/head-target"
          CBVAULT_NO_MMAP=1 cargo +1.97.1 test --locked --release -p cbvault --test twocbh_bridge v2_id_only_scan_matches_named_scan_across_batches --target-dir "$RUNNER_TEMP/head-target"
          cargo +1.97.1 clippy --locked -p cbvault --lib --example native_id_workload --target-dir "$RUNNER_TEMP/head-target" -- -D warnings
      - name: Compare ID lists across revisions, generations and mapping modes
        run: |
          mkdir -p benchmark-report
          { rustc --version; uname -a; lscpu; echo "base=4bdcb5bd6bad314647fc26203f78c7bae7254d77"; git rev-parse HEAD; } > benchmark-report/environment.txt
          python3 scripts/bench-corpus/native-id-bench.py --tier "$TIER" --fixtures "$RUNNER_TEMP/native" --base "$RUNNER_TEMP/base-target/release/examples/native_id_workload" --head "$RUNNER_TEMP/head-target/release/examples/native_id_workload" --report benchmark-report/ids.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-id-benchmark-${{ env.TIER }}-${{ github.run_id }}
          path: benchmark-report/
          retention-days: 14
          if-no-files-found: ignore
