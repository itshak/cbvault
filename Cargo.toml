[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.5"
edition = "2024"
license = "MIT"
rust-version = "1.88"
repository = "https://github.com/itshak/cbvault"
documentation = "https://docs.rs/cbvault"
homepage = "https://github.com/itshak/cbvault"
# crates.io shows the README on the crate page and in search results, and reads
# `categories` to place the crate. Without them a published crate is a wall of
# code with no explanation, which is the whole cost of being on the registry.
readme = "README.md"

[workspace.dependencies]
gigachess = "0.1.10"
cbvault-format = { version = "0.1.5", path = "crates/cbvault-format" }
cbvault-chess = { version = "0.1.5", path = "crates/cbvault-chess" }
cbvault = { version = "0.1.5", path = "crates/cbvault" }
# Path-only on purpose. `cbvault-fixtures` is `publish = false`, so it will never
# exist on crates.io — and a dev-dependency that carries a version requirement
# makes cargo resolve it from the registry when preparing a package for upload,
# which fails every publish with "no matching package named `cbvault-fixtures`
# found". A dev-dependency is not part of a consumer's dependency graph anyway, so
# there is nothing for a version to constrain.
cbvault-fixtures = { path = "crates/cbvault-fixtures" }
rayon = "1.10"
memmap2 = "0.9"



[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "warn"
rust_2018_idioms = "warn"

[workspace.lints.clippy]
all = "warn"
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"

