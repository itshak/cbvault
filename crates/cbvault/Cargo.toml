[package]
name = "cbvault"
description = "Read-only ChessBase CBH and native 2CBH databases: moves, annotations, PGN, search, parallel conversion, CBV/CBZ archives"
version.workspace = true
edition.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true
# On the registry a crate with no keywords and no categories is unsearchable and
# unplaced, so both are stated per crate rather than inherited: crates.io
# validates categories against each crate's own targets.
# crates.io accepts at most 5 keywords per crate and rejects the upload
# otherwise, which is a tag-time failure, so this is capped and checked by
# `cargo test --test registry_metadata`. The dropped "database" is the most
# generic of the six; the five kept are what actually distinguishes the crate.
keywords = ["chess", "chessbase", "pgn", "cbh", "2cbh"]
# crates.io validates `categories` per crate, and it rejects
# `command-line-utilities` on a crate with no binary target, so it is
# on `cbvault-cli` alone rather than inherited by the libraries.
categories = ["games", "parser-implementations"]

[dependencies]
cbvault-format.workspace = true
cbvault-chess.workspace = true
gigachess.workspace = true
rayon.workspace = true



[dev-dependencies]
criterion = { version = "0.5", default-features = false }
cbvault-fixtures.workspace = true

# The strict private gold executable also contains pure generated positive and
# negative oracle tests. Run them in ordinary CI, not only cargo test --examples.
[[example]]
name = "strict_gold_2cbh"
test = true

[[bench]]
name = "phase3"
harness = false

[[bench]]
name = "phase4_export"
harness = false

[[bench]]
name = "bridge"
harness = false

[lints]
workspace = true
