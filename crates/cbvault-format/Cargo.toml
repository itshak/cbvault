[package]
name = "cbvault-format"
description = "Parse classic CBH and native 2CBH binary headers, moves, annotations and CBV/CBZ ChessBase archives"
version.workspace = true
edition.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true
# On the registry a crate with no keywords and no categories is unsearchable and
# unplaced, so both are stated per crate rather than inherited: crates.io
# validates categories against each crate's own targets.
# crates.io accepts at most 5 keywords per crate and rejects the upload
# otherwise, which is a tag-time failure, so this is capped and checked by
# `cargo test --test registry_metadata`. The dropped "parser" is the least
# distinctive of the six: it describes half the ecosystem.
keywords = ["chess", "chessbase", "2cbh", "cbv", "archive"]
# crates.io validates `categories` per crate, and it rejects
# `command-line-utilities` on a crate with no binary target, so it is
# on `cbvault-cli` alone rather than inherited by the libraries.
categories = ["games", "parser-implementations", "encoding"]

[dependencies]
memmap2 = { workspace = true, optional = true }

[features]
default = ["mmap"]
mmap = ["dep:memmap2"]



[dev-dependencies]
cbvault-fixtures.workspace = true

[lints]
workspace = true
