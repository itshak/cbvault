[package]
name = "cbvault-cli"
description = "ChessBase CLI: inspect, verify and export CBH/2CBH games to PGN; list and extract CBV/CBZ archives"
version.workspace = true
edition.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true
# On the registry a crate with no keywords and no categories is unsearchable and
# unplaced, so both are stated per crate rather than inherited: crates.io
# validates categories against each crate's own targets.
keywords = ["chess", "chessbase", "pgn", "2cbh", "cli"]
# crates.io validates `categories` per crate, and it rejects
# `command-line-utilities` on a crate with no binary target, so it is
# on `cbvault-cli` alone rather than inherited by the libraries.
categories = ["games", "command-line-utilities"]

[[bin]]
name = "cbvault"
path = "src/main.rs"

[dependencies]
cbvault-format.workspace = true
cbvault.workspace = true
cbvault-chess.workspace = true
gigachess.workspace = true

[[example]]
name = "dump_null_games"
path = "examples/dump_null_games.rs"

[lints]
workspace = true
